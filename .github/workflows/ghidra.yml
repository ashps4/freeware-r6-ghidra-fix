name: PS4 GhidraOrbis R6 analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      EBOOT: ${{ github.workspace }}/eboot.bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java for Ghidra and GhidraOrbis
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq unzip git python3 file
          mkdir -p analysis/logs analysis/reports analysis/project third_party

      - name: Download pinned Ghidra 12.1.4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/tags/Ghidra_12.1.4_build'

          echo "Lade Ghidra Release-Informationen..."
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$api" -o ghidra-release.json

          echo "Suche Ghidra ZIP..."
          url="$(jq -er \
            '[.assets[] | select(.name | test("^ghidra_12\\.1\\.4.*\\.zip$"))][0].browser_download_url' \
            ghidra-release.json)"

          echo "Lade Ghidra ZIP..."
          curl -fL --retry 3 --retry-all-errors \
            "$url" -o ghidra.zip

          mkdir -p ghidra-dist
          unzip -q ghidra.zip -d ghidra-dist

          analyzer="$(find "$PWD/ghidra-dist" -type f -path '*/support/analyzeHeadless' -print -quit)"
          test -n "$analyzer" || {
            echo "analyzeHeadless wurde nicht gefunden."
            exit 1
          }

          chmod +x "$analyzer"
          ghidra_home="$(dirname "$(dirname "$analyzer")")"

          echo "GHIDRA_ANALYZER=$analyzer" >> "$GITHUB_ENV"
          echo "GHIDRA_HOME=$ghidra_home" >> "$GITHUB_ENV"
          echo "Ghidra installiert: $ghidra_home"
          grep -E 'application.version|application.release.name' \
            "$ghidra_home/Ghidra/application.properties" || true

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Build GhidraOrbis 1.0156 for Ghidra 12.1.4
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.0156 \
            https://github.com/astrelsky/GhidraOrbis.git \
            third_party/GhidraOrbis

          cd third_party/GhidraOrbis
          gradle buildExtension \
            -PGHIDRA_INSTALL_DIR="$GHIDRA_HOME" \
            --no-daemon --stacktrace 2>&1 \
            | tee "$GITHUB_WORKSPACE/analysis/logs/ghidraorbis-build.log"

          shopt -s nullglob
          zips=(dist/*.zip)
          if [[ ${#zips[@]} -eq 0 ]]; then
            echo 'GhidraOrbis build did not produce dist/*.zip.'
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/analysis/build"
          cp "${zips[0]}" "$GITHUB_WORKSPACE/analysis/build/"
          mkdir -p "$GHIDRA_HOME/Ghidra/Extensions"
          unzip -q "${zips[0]}" -d "$GHIDRA_HOME/Ghidra/Extensions"

          props="$(find "$GHIDRA_HOME/Ghidra/Extensions" \
            -type f -name extension.properties -print -quit)"
          test -n "$props" || {
            echo 'Could not verify GhidraOrbis extension.'
            exit 1
          }
          echo "Installed extension metadata: $props"

      - name: Download eboot.bin from R6
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/ashps4/freeware/releases/tags/R6"

          echo "Lade R6 Release-Informationen..."
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$API" -o release.json

          echo "Verfügbare Release-Dateien:"
          jq -r '.assets[] | "\(.name) — \(.size) bytes"' release.json

          ASSET_ID="$(jq -er \
            '.assets[] | select(.name == "eboot.bin") | .id' \
            release.json)"
          ASSET_URL="$(jq -er \
            '.assets[] | select(.name == "eboot.bin") | .browser_download_url' \
            release.json)"

          echo "eboot.bin gefunden: Asset-ID $ASSET_ID"
          if ! curl -fL --retry 3 --retry-all-errors \
            "$ASSET_URL" -o eboot.bin; then
            echo "Direkter Download fehlgeschlagen. Versuche Asset-API..."
            curl -fL --retry 3 --retry-all-errors \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/ashps4/freeware/releases/assets/$ASSET_ID" \
              -o eboot.bin
          fi

          test -s eboot.bin
          echo "Download erfolgreich:"
          ls -lh eboot.bin
          file eboot.bin

      - name: Inspect eboot container and report its signature
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/inspect_eboot.py "$EBOOT" \
            | tee analysis/eboot-inspection.txt

      - name: Analyze eboot with GhidraOrbis installed (ELF image-base workaround)
        shell: bash
        run: |
          set -euo pipefail
          runner_kb="$(awk '/MemTotal:/ {print $2}' /proc/meminfo)"
          export GHIDRA_HEADLESS_MAXMEM=8G

          echo "Runner memory: ${runner_kb} KB"
          echo "Ghidra headless heap: ${GHIDRA_HEADLESS_MAXMEM}"
          echo "ELF loader image base override: 0"

          mkdir -p analysis/project analysis/reports analysis/logs

          "$GHIDRA_ANALYZER" "$PWD/analysis/project" PS4_R6 \
            -scriptPath "$PWD/ghidra_scripts" \
            -preScript ReportImageBase.java \
            -import "$EBOOT" \
            -loader ElfLoader \
            -loader-imagebase 0 \
            -postScript ExportFunctions.java "$PWD/analysis/reports/eboot.functions.csv" \
            -analysisTimeoutPerFile 18000 \
            -max-cpu 2 \
            -log "$PWD/analysis/logs/eboot.log" \
            2>&1 | tee "$PWD/analysis/logs/headless-console.log"

      - name: Record loader diagnostics and verify function export
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/logs analysis/reports
          {
            echo "Ghidra loader workaround: ElfLoader with image base 0"
            echo "Expected image base: 00000000"
            for log in analysis/logs/eboot.log analysis/logs/headless-console.log; do
              if [[ -f "$log" ]]; then
                echo
                echo "===== $log ====="
                echo "GccExceptionAnalyzer message count: $(grep -c 'GccExceptionAnalyzer' "$log" || true)"
                grep -Ei 'Using Loader:|Using Language/Compiler:|image.?base|Orbis|PS4|GccExceptionAnalyzer|ERROR|Exception|OutOfMemory|Wrote function export' "$log" \
                  | tail -n 160 || true
              fi
            done
          } > analysis/loader-diagnostics.txt

          if [[ ! -s analysis/reports/eboot.functions.csv ]]; then
            echo 'No function CSV was generated.'
            echo 'Check analysis/logs/eboot.log, analysis/logs/headless-console.log, and analysis/loader-diagnostics.txt.'
            exit 1
          fi

          echo 'Function export created:'
          wc -l analysis/reports/eboot.functions.csv
          head -n 5 analysis/reports/eboot.functions.csv

      - name: Merge function listings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(analysis/reports/*.functions.csv)
          if (( ${#reports[@]} > 0 )); then
            python3 scripts/merge_function_reports.py \
              --reports analysis/reports \
              --output analysis/reports/all_functions.csv \
              --html analysis/reports/index.html
          else
            echo 'No per-binary function CSV exists; merge skipped.'
          fi

      - name: Upload analysis package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PS4-GhidraOrbis-R6-Analysis
          path: analysis/
          if-no-files-found: warn
          retention-days: 30
